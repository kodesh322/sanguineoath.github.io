<title>SanguineOath — OSRS Clan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0c0506;--bg2:#120809;--surface:rgba(255,255,255,0.025);--surface2:rgba(255,255,255,0.04);
    --border:rgba(160,80,80,0.12);--border-hi:rgba(200,100,80,0.3);
    --accent:#c45a4a;--accent-soft:#d4786a;--accent-glow:rgba(196,90,74,0.15);
    --warm:#f5e6dc;--warm2:#e8cfc0;--warm3:#c4a898;
    --text:#c8b8b0;--text-dim:#8a7e78;--text-faint:#5a5250;
    --green:#6ec87a;--gold:#e8c44a;--silver:#b8b8c0;--bronze:#c8946a;
    --font:'Inter',system-ui,-apple-system,sans-serif;--heading:'Cinzel',Georgia,serif;
  }
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
  ::placeholder{color:var(--text-faint)}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(160,80,80,0.2);border-radius:3px}
  *{scrollbar-width:thin;scrollbar-color:rgba(160,80,80,0.2) transparent}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes softGlow{0%,100%{box-shadow:0 0 30px rgba(196,90,74,.08)}50%{box-shadow:0 0 50px rgba(196,90,74,.18)}}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  @keyframes borderGlow{0%,100%{border-color:rgba(196,90,74,.1)}50%{border-color:rgba(196,90,74,.25)}}
  @keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes textGlow{0%,100%{text-shadow:0 0 8px rgba(196,90,74,.1)}50%{text-shadow:0 0 20px rgba(196,90,74,.3)}}
  @keyframes bgPulse{0%,100%{background-color:rgba(196,90,74,.03)}50%{background-color:rgba(196,90,74,.06)}}
  @keyframes discordGlow{0%,100%{box-shadow:0 0 12px rgba(88,101,242,.08)}50%{box-shadow:0 0 28px rgba(88,101,242,.2)}}
  @keyframes liveGlow{0%,100%{box-shadow:0 0 8px rgba(110,200,122,.05)}50%{box-shadow:0 0 20px rgba(110,200,122,.15)}}
  @keyframes goldShimmer{0%{background-position:-200% center}100%{background-position:200% center}}

  /* ── Layout ── */
  .wrap{max-width:920px;margin:0 auto;padding:0 24px}.center{text-align:center}

  /* ── Header ── */
  header{
    position:relative;z-index:10;
    background:var(--bg2);
    border-bottom:1px solid rgba(160,80,80,.1);
    padding:0;overflow:hidden;
  }
  .header-banner{
    position:absolute;inset:0;
    background-size:cover;background-position:center 40%;
    opacity:.45;pointer-events:none;
  }
  .header-banner::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(12,5,6,.2) 0%,rgba(12,5,6,.6) 50%,rgba(12,5,6,.95) 100%);
  }
  .header-inner{position:relative;z-index:2;padding:36px 0 28px}

  .emblem{
    width:120px;height:120px;
    margin:0 auto 14px;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    filter:drop-shadow(0 4px 24px rgba(196,90,74,.3));
    animation:floatUp 6s ease-in-out infinite;
  }
  .emblem::before{
    content:'';position:absolute;inset:-12px;border-radius:50%;
    background:radial-gradient(circle,rgba(196,90,74,.08),transparent 70%);
    animation:pulse 4s ease-in-out infinite;pointer-events:none;
  }
  .emblem img{width:100%;height:100%;object-fit:contain;position:relative;z-index:1}

  .clan-name{
    font-family:var(--heading);font-weight:900;font-size:36px;letter-spacing:5px;
    background:linear-gradient(90deg,#8a3a30,var(--warm),var(--accent),var(--warm),#8a3a30);
    background-size:300% 100%;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    line-height:1.15;margin-bottom:4px;
    animation:goldShimmer 8s linear infinite;
  }
  .clan-sub{color:var(--text-dim);font-size:13px;letter-spacing:2px;text-transform:uppercase;font-weight:400}

  .header-actions{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:18px;flex-wrap:wrap}

  .discord-btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:10px 22px;
    background:rgba(88,101,242,.1);border:1px solid rgba(88,101,242,.2);
    border-radius:10px;color:#8b9bf7;font-size:13px;font-weight:600;
    font-family:var(--font);text-decoration:none;letter-spacing:.3px;transition:all .3s;
    animation:discordGlow 4s ease-in-out infinite;
  }
  .discord-btn:hover{background:rgba(88,101,242,.22);border-color:rgba(88,101,242,.45);color:#a0b0ff;transform:translateY(-2px);box-shadow:0 8px 30px rgba(88,101,242,.15)}

  .live-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(110,200,122,.08);border:1px solid rgba(110,200,122,.15);
    border-radius:10px;padding:10px 18px;
    color:var(--green);font-size:13px;font-weight:600;
    animation:liveGlow 3s ease-in-out infinite;
  }
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}

  /* ── Nav ── */
  .nav{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:24px}
  .nav button{
    background:transparent;border:1px solid transparent;color:var(--text-dim);
    padding:10px 18px;border-radius:10px;cursor:pointer;font-size:13px;
    font-family:var(--font);font-weight:500;transition:all .2s;letter-spacing:.2px;
  }
  .nav button:hover{color:var(--warm3);background:rgba(255,255,255,.02)}
  .nav button.active{
    background:rgba(196,90,74,.1);border-color:rgba(196,90,74,.2);
    color:var(--accent-soft);font-weight:600;
    box-shadow:0 0 16px rgba(196,90,74,.08);
    animation:borderGlow 3s ease-in-out infinite;
  }

  /* ── Main ── */
  main{position:relative;z-index:10;max-width:920px;margin:0 auto;padding:36px 24px 80px}

  /* ── Cards ── */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .card-warm{background:linear-gradient(135deg,rgba(196,90,74,.04),rgba(255,255,255,.02));border:1px solid rgba(196,90,74,.1);border-radius:14px;transition:border-color .3s,box-shadow .3s}
  .card-warm:hover{border-color:rgba(196,90,74,.18);box-shadow:0 4px 20px rgba(196,90,74,.04)}

  /* ── Section Titles ── */
  .section-title{font-family:var(--heading);color:var(--warm2);font-weight:700;font-size:22px;letter-spacing:1px;text-align:center;margin-bottom:24px;text-shadow:0 0 30px rgba(196,90,74,.08)}
  .sub-title{font-family:var(--heading);color:var(--accent-soft);font-weight:600;font-size:15px;letter-spacing:.5px;text-align:center;margin-bottom:16px;text-shadow:0 0 20px rgba(196,90,74,.06)}

  /* ── Welcome / Hero ── */
  .hero{text-align:center;margin-bottom:36px}
  .hero-welcome{font-family:var(--heading);font-size:28px;font-weight:700;color:var(--warm);letter-spacing:1px;margin-bottom:8px}
  .hero-tagline{color:var(--text);font-size:16px;line-height:1.7;max-width:520px;margin:0 auto 32px;font-weight:300}
  .hero-desc{color:var(--text);font-size:16px;line-height:1.8;max-width:560px;margin:0 auto 28px;font-weight:300}
  .hero-desc strong{color:var(--warm2);font-weight:500}

  .info-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0;max-width:560px;margin:0 auto 36px;background:rgba(196,90,74,.03);border:1px solid rgba(196,90,74,.08);border-radius:12px;overflow:hidden;animation:borderGlow 5s ease-in-out infinite}
  .info-cell{padding:16px 12px;text-align:center;border-right:1px solid rgba(196,90,74,.06);transition:background .3s}
  .info-cell:hover{background:rgba(196,90,74,.04)}
  .info-cell:last-child{border-right:none}
  .info-cell .label{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1.5px;font-weight:600;margin-bottom:4px}
  .info-cell .value{color:var(--accent-soft);font-size:16px;font-weight:700;font-family:var(--heading)}

  /* ── Pillar Cards ── */
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:36px}
  .pillar{
    background:linear-gradient(135deg,rgba(196,90,74,.04),rgba(255,255,255,.015));
    border:1px solid rgba(196,90,74,.1);border-radius:14px;
    padding:28px 22px;text-align:center;transition:all .35s;
    position:relative;overflow:hidden;
  }
  .pillar::before{
    content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
    background:radial-gradient(circle,rgba(196,90,74,.04),transparent 60%);
    opacity:0;transition:opacity .35s;pointer-events:none;
  }
  .pillar:hover::before{opacity:1}
  .pillar:hover{border-color:rgba(196,90,74,.3);transform:translateY(-4px);box-shadow:0 12px 40px rgba(196,90,74,.08)}
  .pillar-icon{font-size:28px;margin-bottom:14px;display:block;transition:transform .35s}
  .pillar:hover .pillar-icon{transform:scale(1.15)}
  .pillar-title{font-family:var(--heading);color:var(--warm2);font-size:15px;font-weight:700;letter-spacing:.5px;margin-bottom:8px}
  .pillar-desc{color:var(--text-dim);font-size:13px;line-height:1.6}

  /* ── Join Section ── */
  .join-section{
    background:linear-gradient(135deg,rgba(196,90,74,.05),rgba(88,101,242,.03));
    border:1px solid rgba(196,90,74,.12);border-radius:16px;
    padding:40px 32px;text-align:center;margin-bottom:36px;
    position:relative;overflow:hidden;
  }
  .join-section::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 50%,rgba(88,101,242,.03),transparent 70%);
    pointer-events:none;animation:pulse 6s ease-in-out infinite;
  }
  .join-title{font-family:var(--heading);color:var(--warm);font-size:22px;font-weight:700;letter-spacing:1px;margin-bottom:8px;position:relative;animation:textGlow 4s ease-in-out infinite}
  .join-desc{color:var(--text-dim);font-size:14px;margin-bottom:24px;max-width:400px;margin-left:auto;margin-right:auto;position:relative}
  .join-btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:14px 32px;background:rgba(88,101,242,.15);
    border:1px solid rgba(88,101,242,.3);border-radius:12px;
    color:#8b9bf7;font-size:15px;font-weight:700;font-family:var(--font);
    text-decoration:none;letter-spacing:.3px;transition:all .3s;
    position:relative;animation:discordGlow 4s ease-in-out infinite;
  }
  .join-btn:hover{background:rgba(88,101,242,.25);border-color:rgba(88,101,242,.5);transform:translateY(-3px);box-shadow:0 12px 40px rgba(88,101,242,.2);color:#b0c0ff}

  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:480px;margin:0 auto}
  .stat-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .stat-box{
    background:rgba(196,90,74,.03);border:1px solid rgba(196,90,74,.08);
    border-radius:12px;padding:18px 14px;text-align:center;transition:all .3s;
  }
  .stat-box:hover{border-color:rgba(196,90,74,.22);box-shadow:0 0 16px rgba(196,90,74,.06);transform:translateY(-1px)}
  .stat-label{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:2px;font-weight:600;margin-bottom:8px}
  .stat-value{color:var(--warm2);font-size:17px;font-weight:700;font-family:var(--heading);word-break:break-word}

  /* ── Table Rows ── */
  .col-head{display:grid;padding:12px 20px;font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1.5px;font-weight:600;border-bottom:1px solid rgba(160,80,80,.08)}
  .row{display:grid;align-items:center;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.02);cursor:pointer;transition:all .2s}
  .row:hover{background:rgba(196,90,74,.05);box-shadow:inset 3px 0 0 var(--accent)}
  .row.top3{background:rgba(196,90,74,.03)}.row.top3:hover{background:rgba(196,90,74,.07)}
  .player-name{display:flex;align-items:center;gap:12px}
  .role-dot{display:inline-block;width:8px;height:8px;border-radius:50%}
  .rank-num{font-family:var(--heading);font-weight:700;font-size:15px}
  .gain{color:var(--green);font-weight:600}.tabnum{font-variant-numeric:tabular-nums}

  /* ── Competition Cards ── */
  .comp-card{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:20px 24px;cursor:pointer;transition:all .3s;
  }
  .comp-card:hover{border-color:var(--border-hi);background:var(--surface2);transform:translateY(-2px);box-shadow:0 8px 30px rgba(196,90,74,.06)}
  .comp-card.live{border-color:rgba(110,200,122,.2);animation:liveGlow 3s ease-in-out infinite}
  .comp-title{font-family:var(--heading);color:var(--warm2);font-size:15px;font-weight:600;line-height:1.4}
  .comp-status{font-size:10px;font-weight:700;padding:4px 12px;border-radius:6px;letter-spacing:1px;flex-shrink:0}

  /* ── Inputs ── */
  .search-input{
    padding:11px 18px;background:rgba(20,12,12,.7);
    border:1px solid rgba(160,80,80,.12);border-radius:10px;
    color:var(--warm2);font-size:14px;font-family:var(--font);
    outline:none;transition:all .3s;
  }
  .search-input:focus{border-color:rgba(196,90,74,.35);box-shadow:0 0 0 3px rgba(196,90,74,.08),0 0 20px rgba(196,90,74,.06)}
  select{
    padding:10px 16px;background:rgba(20,12,12,.7);
    border:1px solid rgba(160,80,80,.12);border-radius:10px;
    color:var(--text);font-size:13px;font-family:var(--font);
    outline:none;cursor:pointer;appearance:auto;transition:border-color .2s;
  }
  select:focus{border-color:rgba(196,90,74,.3)}

  /* ── Modal ── */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:center;justify-content:center}
  .modal{
    background:linear-gradient(180deg,#160a0a,#0c0506);
    border:1px solid rgba(196,90,74,.2);border-radius:16px;
    padding:32px;max-width:700px;width:92%;max-height:82vh;overflow-y:auto;
    box-shadow:0 30px 100px rgba(0,0,0,.6);
  }
  .modal-close{
    background:rgba(196,90,74,.08);border:1px solid rgba(196,90,74,.15);
    color:var(--text-dim);width:38px;height:38px;border-radius:10px;
    cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s;
  }
  .modal-close:hover{background:rgba(196,90,74,.15);color:var(--warm2)}

  /* ── Misc ── */
  .spinner{width:32px;height:32px;border:3px solid rgba(196,90,74,.1);border-top:3px solid var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:60px auto}
  .empty{color:var(--text-faint);text-align:center;padding:48px 20px;font-size:14px}
  .load-status{text-align:center;color:var(--text-faint);font-size:13px;margin-top:12px}

  footer{position:relative;z-index:10;border-top:1px solid rgba(160,80,80,.06);padding:28px 0;text-align:center}
  footer p{color:rgba(160,80,80,.2);font-size:11px;font-family:var(--heading);letter-spacing:4px;font-weight:600}

  .skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
  .skill-row{display:flex;justify-content:space-between;padding:9px 14px;background:rgba(255,255,255,.02);border-radius:8px;font-size:13px;transition:background .15s}
  .skill-row:hover{background:rgba(255,255,255,.04)}
  .skill-row span:first-child{color:var(--text-dim);text-transform:capitalize}
  .skill-row span:last-child{color:var(--warm2);font-weight:600}

  /* ── Home sections ── */
  .home-section{margin-bottom:32px}
  .home-section:last-child{margin-bottom:0}

  @media(max-width:600px){
    .clan-name{font-size:26px;letter-spacing:3px}
    .wrap{padding:0 16px}main{padding:24px 16px 60px}
    .col-head,.row{padding-left:14px;padding-right:14px}
    .stat-grid{grid-template-columns:1fr 1fr}
    header .header-inner{padding:24px 0 20px}
    .emblem{width:90px;height:90px}
    .pillars{grid-template-columns:1fr}
    .info-row{grid-template-columns:repeat(2,1fr)}
    .info-cell:nth-child(2){border-right:none}
    .info-cell:nth-child(3),.info-cell:nth-child(4){border-top:1px solid rgba(196,90,74,.06)}
    .hero-welcome{font-size:22px}
    .join-section{padding:28px 20px}
    .nav{gap:3px}
    .nav button{padding:8px 12px;font-size:11px}
  }
  .hidden{display:none!important}
</style>
</head>

<script>
const GID=22998,API="https://api.wiseoldman.net/v2",PROXY="/.netlify/functions/wom";
const SKILLS=["overall","attack","defence","strength","hitpoints","ranged","prayer","magic","cooking","woodcutting","fletching","fishing","firemaking","crafting","smithing","mining","herblore","agility","thieving","slayer","farming","runecrafting","hunter","construction"];
const BOSSES=["abyssal_sire","alchemical_hydra","artio","barrows_chests","bryophyta","callisto","calvarion","cerberus","chambers_of_xeric","chambers_of_xeric_challenge_mode","chaos_elemental","chaos_fanatic","commander_zilyana","corporeal_beast","crazy_archaeologist","dagannoth_prime","dagannoth_rex","dagannoth_supreme","deranged_archaeologist","duke_sucellus","general_graardor","giant_mole","grotesque_guardians","hespori","kalphite_queen","king_black_dragon","kraken","kreearra","kril_tsutsaroth","lunar_chests","mimic","nex","nightmare","phosanis_nightmare","obor","phantom_muspah","sarachnis","scorpia","scurrius","skotizo","sol_heredit","spindel","tempoross","the_gauntlet","the_corrupted_gauntlet","the_leviathan","the_whisperer","theatre_of_blood","theatre_of_blood_hard_mode","thermonuclear_smoke_devil","tombs_of_amascut","tombs_of_amascut_expert","tzkal_zuk","tztok_jad","vardorvis","venenatis","vetion","vorkath","wintertodt","zalcano","zulrah"];
const RO={owner:0,deputy_owner:1,administrator:2,moderator:3,guardian:4,sergeant:5,corporal:6,recruit:7,member:8};
const RC={owner:"#e05a4a",deputy_owner:"#d4786a",administrator:"#c45a4a",moderator:"#b85a50",guardian:"#a06058",sergeant:"#8a6058",corporal:"#7a6860",recruit:"#888",member:"#a09890"};

let S={tab:"home",group:null,members:[],comps:[],achv:[],search:""};
const delay=ms=>new Promise(r=>setTimeout(r,ms));
const cache={};

async function wom(path,retries=3){
  for(let a=0;a<retries;a++){
    try{
      console.log(`[WOM] ${a>0?"Retry "+a+" ":""}${path}`);
      const r=await fetch(PROXY+"?path="+encodeURIComponent(path));
      if(r.status===429){const w=Math.min(5000*(a+1),15000);console.warn(`[WOM] 429 on ${path}, waiting ${w/1000}s`);setStatus(`Rate limited — retrying in ${w/1000}s...`);await delay(w);continue}
      if(!r.ok)throw new Error(`HTTP ${r.status}`);
      const j=await r.json();
      console.log(`[WOM] ✓ ${path} → ${Array.isArray(j)?j.length+" items":"object"}`);
      return j;
    }catch(e){console.error(`[WOM] ${path}:`,e.message);if(a<retries-1)await delay(2000*(a+1))}
  }
  return null;
}
async function cachedWom(k,p){if(cache[k])return cache[k];const d=await wom(p);if(d)cache[k]=d;return d}
function setStatus(m){const e=document.getElementById("load-status");if(e)e.textContent=m}

function fmt(n){if(n==null||n===-1)return"—";if(typeof n!=="number")return String(n);if(Math.abs(n)>=1e6)return(n/1e6).toFixed(1)+"M";if(Math.abs(n)>=1e3)return(n/1e3).toFixed(1)+"K";return n.toLocaleString()}
function fmtG(n){return(!n||n<=0)?"—":"+"+fmt(n)}
function tAgo(d){if(!d)return"—";const m=Math.floor((Date.now()-new Date(d).getTime())/6e4);if(m<60)return m+"m ago";const h=Math.floor(m/60);if(h<24)return h+"h ago";const dy=Math.floor(h/24);return dy<30?dy+"d ago":Math.floor(dy/30)+"mo ago"}
function ml(m){return m?m.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase()):""}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function rkC(i){return i===0?"var(--gold)":i===1?"var(--silver)":i===2?"var(--bronze)":"var(--text-faint)"}
function getLive(){const n=Date.now();return S.comps.filter(c=>n>=new Date(c.startsAt).getTime()&&n<new Date(c.endsAt).getTime())}

function metricOpts(){let h='<optgroup label="Skills">';SKILLS.forEach(s=>h+=`<option value="${s}">${ml(s)}</option>`);h+='</optgroup><optgroup label="Bosses">';BOSSES.forEach(b=>h+=`<option value="${b}">${ml(b)}</option>`);return h+'</optgroup>'}
function periodOpts(){return["day","week","month","year"].map(p=>`<option value="${p}">${p[0].toUpperCase()+p.slice(1)}</option>`).join("")}

function buildNav(){
  var tabs=[["home","Home"],["about","About"],["ranks","Ranks"],["members","Members"],["hiscores","Hiscores"],["competitions","Competitions"],["achievements","Achievements"]];
  document.getElementById("nav").innerHTML=tabs.map(function(t){return'<button data-tab="'+t[0]+'" class="'+(S.tab===t[0]?"active":"")+'">'+t[1]+'</button>'}).join("");
  document.querySelectorAll(".nav button").forEach(function(b){
    b.addEventListener("click",function(){
      S.tab=b.dataset.tab;buildNav();renderTab();
    });

  // Live CST clock + event countdown + SOTW countdown
  function tickClock(){
    const ck=document.getElementById("cst-clock");
    if(ck){
      const now=new Date().toLocaleTimeString("en-US",{timeZone:"America/Chicago",hour:"numeric",minute:"2-digit",hour12:true});
      ck.textContent=now;
    }
    const cd=document.getElementById("party-countdown");
    if(cd){
      var partyTime=new Date("2026-03-22T11:00:00-05:00").getTime();
      var now2=Date.now();
      if(now2<partyTime){
        var diff=partyTime-now2;
        var d=Math.floor(diff/864e5),hr=Math.floor((diff%864e5)/36e5),mn=Math.floor((diff%36e5)/6e4),sc=Math.floor((diff%6e4)/1e3);
        cd.innerHTML='Drop party in <span style="color:var(--gold);font-weight:700">'+d+'d '+hr+'h '+mn+'m '+sc+'s</span>';
      }else{
        cd.innerHTML='\uD83C\uDF89 <span style="color:var(--gold);font-weight:700">DROP PARTY IS LIVE!</span> \uD83C\uDF89';
      }
    }
    const sotwEl=document.getElementById("sotw-countdown");
    if(sotwEl){
      var sotwStart=new Date("2026-03-15T18:00:00-05:00").getTime();
      var sotwEnd=new Date("2026-03-22T18:00:00-05:00").getTime();
      var now3=Date.now();
      if(now3<sotwStart){
        var diff=sotwStart-now3;
        var d=Math.floor(diff/864e5),hr=Math.floor((diff%864e5)/36e5),mn=Math.floor((diff%36e5)/6e4),s=Math.floor((diff%6e4)/1e3);
        sotwEl.innerHTML='Starts in <span style="color:#3498db;font-weight:700">'+d+'d '+hr+'h '+mn+'m '+s+'s</span>';
      }else if(now3<sotwEnd){
        var diff=sotwEnd-now3;
        var d=Math.floor(diff/864e5),hr=Math.floor((diff%864e5)/36e5),mn=Math.floor((diff%36e5)/6e4),s=Math.floor((diff%6e4)/1e3);
        sotwEl.innerHTML='\u26A1 <span style="color:var(--green);font-weight:700">LIVE</span> \u2014 Ends in <span style="color:var(--green);font-weight:700">'+d+'d '+hr+'h '+mn+'m '+s+'s</span>';
      }else{
        sotwEl.innerHTML='<span style="color:var(--text-faint)">Competition ended</span>';
      }
    }
  }
  tickClock();
  if(window._cstTimer)clearInterval(window._cstTimer);
  window._cstTimer=setInterval(tickClock,1000);
}

function renderBotCmds(el){
  function cmdCard(slash,name,desc,example,color){
    color=color||"rgba(196,90,74,.15)";
    var ex=example?'<div style="margin-top:6px;font-size:13px;color:var(--text-faint)">Example: <code style="background:rgba(196,90,74,.08);border:1px solid rgba(196,90,74,.15);border-radius:4px;padding:1px 8px;font-size:12px;color:var(--accent-soft)">'+example+'</code></div>':"";
    return'<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:grid;grid-template-columns:auto 1fr;gap:0 18px;align-items:start;transition:all .2s;position:relative;overflow:hidden">'
      +'<div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:'+color+';border-radius:2px 0 0 2px"></div>'
      +'<div style="font-family:var(--heading);font-size:15px;font-weight:700;color:'+color+';white-space:nowrap;padding-top:1px"><span style="opacity:.5">/</span>'+slash+'</div>'
      +'<div><div style="color:var(--warm2);font-size:15px;line-height:1.5;font-weight:300">'+desc+'</div>'+ex+'</div>'
      +'</div>';
  }
  function section(icon,title,cards){
    return'<div style="margin-bottom:36px">'
      +'<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid rgba(196,90,74,.1)">'
      +'<span style="font-size:20px">'+icon+'</span>'
      +'<span style="font-family:var(--heading);font-size:15px;font-weight:700;color:var(--warm2);letter-spacing:2px;text-transform:uppercase">'+title+'</span>'
      +'<div style="flex:1;height:1px;background:linear-gradient(90deg,rgba(196,90,74,.15),transparent)"></div>'
      +'</div>'
      +'<div style="display:grid;gap:8px">'+cards+'</div>'
      +'</div>';
  }
  var GOLD="var(--gold)";var GREEN="var(--green)";var BLUE="#5a9ae0";var RED="#e05050";var PINK="#e070a0";var DEF="var(--accent-soft)";
  var h='<div class="section-title">Discord Bot Commands</div>';
  h+='<div class="card-warm" style="padding:20px 24px;text-align:center;margin-bottom:32px">'

let _compData=null,_compSort="xp";

async function openComp(id){
  const root=document.getElementById("modal-root");root.className="modal-bg";root.innerHTML='<div class="modal"><div class="spinner"></div></div>';
  root.onclick=e=>{if(e.target===root)closeModal()};
  _compData=await wom(`/competitions/${id}`);_compSort="xp";
  if(!_compData){root.querySelector(".modal").innerHTML='<p style="color:var(--text-dim);text-align:center">Couldn\'t load — API may be busy.</p>';return}
  drawComp();
}

function drawComp(){
  const d=_compData,root=document.getElementById("modal-root");if(!d||!root)return;
  const parts=(d.participations||[]).map(p=>({
    name:p.player?.displayName||"?",
    xp:p.progress?.gained||0,
    lvl:p.levels?.gained||0,
    sLvl:p.levels?.start||0,
    eLvl:p.levels?.end||0
  }));
  if(_compSort==="levels")parts.sort((a,b)=>b.lvl-a.lvl||b.xp-a.xp);
  else parts.sort((a,b)=>b.xp-a.xp||b.lvl-a.lvl);

  const on=`background:rgba(196,90,74,.12);border-color:rgba(196,90,74,.3);color:var(--accent-soft);font-weight:600`;
  const off=`background:transparent;border-color:rgba(160,80,80,.12);color:var(--text-dim);font-weight:400`;

  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <div><h2 style="font-family:var(--heading);color:var(--warm);font-size:20px;font-weight:700">${esc(d.title)}</h2>
    <span style="font-size:13px;color:var(--text-dim)">\u2694 ${ml(d.metric)}</span></div>
    <button class="modal-close" onclick="closeModal()">\u2715</button></div>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <button onclick="_compSort='xp';drawComp()" style="padding:8px 16px;border-radius:8px;border:1px solid;cursor:pointer;font-family:var(--font);font-size:12px;letter-spacing:.3px;transition:all .2s;${_compSort==='xp'?on:off}">Sort by XP</button>
      <button onclick="_compSort='levels';drawComp()" style="padding:8px 16px;border-radius:8px;border:1px solid;cursor:pointer;font-family:var(--font);font-size:12px;letter-spacing:.3px;transition:all .2s;${_compSort==='levels'?on:off}">Sort by Levels</button>
    </div>
    <div style="display:grid;grid-template-columns:36px 1fr 90px 80px;padding:8px 14px;font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1.5px;font-weight:600;border-bottom:1px solid rgba(160,80,80,.08)">
      <span>#</span><span>Player</span><span style="text-align:right">XP Gained</span><span style="text-align:right">Levels</span></div>`;

  parts.slice(0,30).forEach((p,i)=>{
    const lt=p.lvl>0?`+${p.lvl}`:"\u2014";
    const tip=p.lvl>0?`${p.sLvl} \u2192 ${p.eLvl}`:"";
    h+=`<div style="display:grid;grid-template-columns:36px 1fr 90px 80px;align-items:center;padding:11px 14px;${i<3?"background:rgba(196,90,74,.04);border-radius:8px;":""}border-bottom:1px solid rgba(255,255,255,.02)">
      <span class="rank-num" style="color:${rkC(i)}">${i+1}</span>
      <span style="color:var(--warm2);font-size:14px">${esc(p.name)}</span>
      <span class="gain tabnum" style="font-size:13px;text-align:right">${fmtG(p.xp)}</span>
      <span class="tabnum" style="font-size:13px;text-align:right;color:${p.lvl>0?"#8bb8e8":"var(--text-faint)"};font-weight:${p.lvl>0?"600":"400"}" title="${tip}">${lt}</span>
    </div>`;
  });
  root.querySelector(".modal").innerHTML=h;
}

const PRICE_API="https://prices.runescape.wiki/api/v1/osrs";
let priceMap=null,itemMap=null;

async function loadPriceMaps(){
  if(priceMap&&itemMap)return;
  try{
    const [mapRes,priceRes]=await Promise.all([
      fetch("https://prices.runescape.wiki/api/v1/osrs/mapping",{headers:{"User-Agent":"SanguineOath Clan Site"}}),
      fetch("https://prices.runescape.wiki/api/v1/osrs/latest",{headers:{"User-Agent":"SanguineOath Clan Site"}})
    ]);
    const mapData=await mapRes.json();
    const priceData=await priceRes.json();
    itemMap={};
    mapData.forEach(i=>{itemMap[i.id]={name:i.name,members:i.members,highalch:i.highalch,lowalch:i.lowalch,limit:i.limit,examine:i.examine}});
    priceMap=priceData.data;
    console.log("[Prices] Loaded",Object.keys(itemMap).length,"items");
  }catch(e){console.error("[Prices]",e)}
}

function renderPrices(el){
  el.innerHTML=`<div class="section-title">GE Price Checker</div>
    <div class="center" style="margin-bottom:24px">
      <input type="text" class="search-input" id="price-search" placeholder="Search any item..." style="width:100%;max-width:460px;font-size:15px;padding:14px 20px">
      <p style="color:var(--text-faint);font-size:12px;margin-top:8px">Powered by the OSRS Wiki Real-Time Prices API</p>
    </div>
    <div id="price-results" style="max-width:700px;margin:0 auto"></div>
    <div id="price-loading" class="center" style="margin-top:20px"><div class="spinner"></div><p class="load-status">Loading item database...</p></div>`;

  loadPriceMaps().then(()=>{
    document.getElementById("price-loading").classList.add("hidden");
    document.getElementById("price-search").focus();
  });

  let debounce=null;
  document.getElementById("price-search").addEventListener("input",function(){
    clearTimeout(debounce);
    debounce=setTimeout(()=>searchPrices(this.value),200);
  });
}

function searchPrices(q){
  const res=document.getElementById("price-results");
  if(!q||q.length<2||!itemMap){res.innerHTML="";return}
  const ql=q.toLowerCase();
  const matches=Object.entries(itemMap).filter(([id,item])=>item.name.toLowerCase().includes(ql)).slice(0,20);
  if(!matches.length){res.innerHTML='<div class="empty">No items found</div>';return}

  let h='<div class="card">';
  matches.forEach(([id,item])=>{
    const p=priceMap[id];
    const buy=p?.high||0,sell=p?.low||0;
    const avg=buy&&sell?Math.round((buy+sell)/2):buy||sell;
    const spread=buy&&sell?buy-sell:0;
    const ha=item.highalch||0;
    const profit=ha&&sell?ha-sell-1:0;

    h+=`<div style="display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.02)">
      <div>
        <div style="color:var(--warm2);font-weight:600;font-size:14px">${esc(item.name)}</div>
        <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:4px">
          <span style="font-size:12px;color:var(--text-dim)">Buy: <span style="color:var(--green);font-weight:600">${buy?fmt(buy)+"gp":"—"}</span></span>
          <span style="font-size:12px;color:var(--text-dim)">Sell: <span style="color:#e8a44a;font-weight:600">${sell?fmt(sell)+"gp":"—"}</span></span>
          ${spread?`<span style="font-size:12px;color:var(--text-faint)">Spread: ${fmt(spread)}gp</span>`:""}
        </div>
      </div>
      <div style="text-align:right">
        <div style="color:var(--warm2);font-size:16px;font-weight:700;font-family:var(--heading)">${avg?fmt(avg)+" gp":"No data"}</div>
        ${ha?`<div style="font-size:11px;color:var(--text-faint);margin-top:2px">HA: ${fmt(ha)}gp${profit>0?' <span style="color:var(--green)">(+'+fmt(profit)+')</span>':""}</div>`:""}
      </div>
    </div>`;
  });
  res.innerHTML=h+'</div>';
}

function spinBoss(cat){
  var pool=cat==="all"?BOSS_DATA:BOSS_DATA.filter(function(b){return b.cat===cat});
  if(!pool.length)return;
  var el=document.getElementById("boss-spinner");
  var wiki=document.getElementById("spin-wiki");
  var count=0,interval=setInterval(function(){
    var rand=pool[Math.floor(Math.random()*pool.length)];
    el.textContent=rand.name;
    el.style.color="var(--text-dim)";
    count++;
    if(count>15){
      clearInterval(interval);
      var pick=pool[Math.floor(Math.random()*pool.length)];
      el.textContent=pick.name;
      el.style.color="var(--accent)";
      el.style.textShadow="0 0 20px rgba(196,90,74,.4)";
      setTimeout(function(){el.style.textShadow="none"},2000);
      wiki.innerHTML='<a href="https://oldschool.runescape.wiki/w/'+encodeURIComponent(pick.wiki||pick.name)+'/Strategies" target="_blank" rel="noopener" style="color:var(--accent-soft);font-size:11px;text-decoration:none;border-bottom:1px solid rgba(196,90,74,.2)">View strategy guide \u2192</a>';
    }
  },80);
}

  await delay(1500);
  setStatus("Loading competitions...");const co=await wom(`/groups/${GID}/competitions?limit=50`);if(co&&Array.isArray(co))S.comps=co;
  await delay(1500);

    document.getElementById("content").innerHTML=`<div class="center" style="padding:48px 20px">
      <p style="color:var(--accent);font-size:15px;margin-bottom:8px">Couldn't reach the Wise Old Man API</p>
      <p style="color:var(--text-faint);font-size:13px;margin-bottom:24px">This usually means too many requests were made. Wait about 60 seconds and try again.</p>
      <button onclick="location.reload()" style="background:rgba(196,90,74,.1);border:1px solid rgba(196,90,74,.25);color:var(--warm2);padding:12px 32px;border-radius:10px;cursor:pointer;font-family:var(--font);font-size:14px;font-weight:500;transition:all .2s">Retry</button>
    </div>`;return;
  }

  document.getElementById("clan-sub").textContent=`${S.group?.memberCount||S.members.length} Members`;
  const live=getLive();
  if(live.length){const b=document.getElementById("live-badge");b.className="live-badge";b.innerHTML=`<span class="live-dot"></span> ${live.length} Live Competition${live.length>1?"s":""}`}
  buildNav();renderTab();
}
init();
</script>
</body>
</html>
